version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_APP=app.py
      # El secreto se toma del entorno del host (p. ej. archivo .env), ya no
      # esta escrito en el repositorio. Debe definirse SECRET_KEY antes de
      # levantar el contenedor. FLASK_DEBUG desactivado por defecto.
      - FLASK_ENV=${FLASK_ENV:-production}
      - SECRET_KEY=${SECRET_KEY:?Defina SECRET_KEY en el entorno/.env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    user: "node"
    depends_on:
      - backend
    restart: always 